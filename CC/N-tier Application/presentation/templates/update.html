<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Book - Library Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Update Book</h1>
        </header>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <section class="add-book-section card">
            <h2>Edit Details for "{{ book.title }}"</h2>
            <form action="{{ url_for('update_book', book_id=book.id) }}" method="POST" class="add-form">
                <div class="form-group">
                    <label for="title">Title:</label>
                    <input type="text" id="title" name="title" value="{{ book.title }}" required>
                </div>
                <div class="form-group">
                    <label for="author">Author:</label>
                    <input type="text" id="author" name="author" value="{{ book.author }}" required>
                </div>
                <div class="form-group">
                    <label for="isbn">ISBN (10 or 13 digits):</label>
                    <input type="text" id="isbn" name="isbn" value="{{ book.isbn }}" required>
                </div>
                <div class="form-group row">
                    <div class="col">
                        <label for="year">Publication Year:</label>
                        <input type="number" id="year" name="year" value="{{ book.publication_year }}" required>
                    </div>
                    <div class="col">
                        <label for="quantity">Quantity:</label>
                        <input type="number" id="quantity" name="quantity" value="{{ book.quantity }}" required min="0">
                    </div>
                </div>
                <div class="row" style="margin-top: 1rem;">
                    <button type="submit" class="btn btn-primary" style="margin-right: 0.5rem;">Save Changes</button>
                    <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </section>
    </div>
</body>
</html>
